name = "kingwen-sovereign-engine"
compatibility_date = "2026-08-31"
pages_build_output_dir = "public"

[vars]
ENGINE_NAME = "King Wen 64 Sovereign Model Engine"
ENGINE_VERSION = "3.2.0"
TOTAL_SECTORS = "64"
STATE_SPACE_BINARY = "512"
STATE_SPACE_TERNARY = "729"
STATE_SPACE_RESOLVED = "5832"
ENVIRONMENT = "production"

# Route Headers
[[headers]]
for = "/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, POST, OPTIONS"
Access-Control-Allow-Headers = "Content-Type, X-GibberLink-Protocol, X-KingWen-Phase"
X-Content-Type-Options = "nosniff"
